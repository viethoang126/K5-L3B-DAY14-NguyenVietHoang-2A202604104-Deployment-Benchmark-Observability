# docker compose up --build
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # AGENT_API_KEY đặt ở đây (không commit)
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
