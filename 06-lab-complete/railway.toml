# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên Railway, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Không đặt startCommand: dùng CMD trong Dockerfile (đã đọc $PORT)
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
